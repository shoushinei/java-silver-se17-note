<header class="xbar">
  <div class="ttl">自作模擬試験<small>Java Silver SE 17</small></div>

<div class="wrap">
  <section class="intro">
    <div class="eyebrow">JAVA SILVER SE 17 &nbsp;/&nbsp; 自作模擬試験</div>
    <h1>模擬試験</h1>
    <p class="lead">統合ノートで学んだ論点を、本番に近い形式で確かめるための模擬試験です。どの試験も「時間制限つきのテスト」と「問題と解説を読む振り返り」の2通りで使えます。</p>
    <div class="xlist">
<!--{{cards}}-->
    </div>
    <p class="crumbs"><a href="../">← 統合ノート（テキスト）に戻る</a></p>
  </section>
</div>

<script>
/* 各試験の最新の受験結果を、このブラウザの保存内容から表示する */
(function () {
  Array.prototype.forEach.call(document.querySelectorAll("[data-exam]"), function (el) {
    var h = null;
    try { h = JSON.parse(localStorage.getItem("java-silver-exam:" + el.dataset.exam + ":history")); } catch (e) { /* 読めなければ何も出さない */ }
    if (!h || !h.length) return;
    var best = h.reduce(function (m, x) { return x.correct > m.correct ? x : m; }, h[0]);
    el.textContent = "前回 " + h[0].correct + " / " + h[0].total + "（" + Math.round(h[0].rate * 100) + "%）・最高 " +
      best.correct + " / " + best.total + "・受験 " + h.length + " 回";
  });
})();
</script>
</body>
