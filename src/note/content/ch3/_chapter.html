<div class="chap" id="ch3">
  <div class="chap-num">CHAPTER 3</div>
  <h2 class="chap-title">演算子と制御構造</h2>
  <p class="chap-lead">この章の失点は「知らなかった」ではなく「読み違えた」で起きます。<code>i++</code> と <code>++i</code> の1文字、<code>&amp;</code> と <code>&amp;&amp;</code> の1文字、<code>:</code> と <code>-&gt;</code> の違い。そして <code>switch</code> 式は SE 17 で完全に新規の範囲です。</p>
</div>
