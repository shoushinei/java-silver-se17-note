  <h2 class="chap-title">クラスの定義とインスタンスの使用</h2>
  <p class="chap-lead">出題数がもっとも多い章です。前半（クラス・コンストラクタ・オーバーロード・static）は Bronze と重なりますが、問われる精度が上がります。後半の <code>instanceof</code> パターンマッチングと <code>record</code> は SE 17 で新規に追加された範囲で、確実に出ます。</p>
