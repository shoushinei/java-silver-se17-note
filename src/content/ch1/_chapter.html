  <h2 class="chap-title">Java の概要と簡単な Java プログラムの作成</h2>
  <p class="chap-lead">配点は小さいのに、落とすと痛い章です。問われるのは知識ではなく<strong>形</strong>。<code>main</code> のシグネチャ、<code>package</code> と <code>import</code> の順序、<code>java</code> コマンドに何を渡すか。すべて「1文字違うと動かない」種類の規則で、覚えれば確実に取れます。</p>
