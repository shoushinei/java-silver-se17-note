name: build

# docs/ は src/ から生成したもの。
# ビルドし忘れたまま push されると公開ページだけ古くなるので、CI で突き合わせる。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: docs/ が src/ と一致するか確認
        run: node build.mjs --check

  # 模擬試験の問題文のコードと解説の主張を、試験と同じ Java 17 で実際に確かめる
  verify-exams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 模擬試験のコードを javac / java で検証
        run: node tools/verify-exams.mjs
